<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; padding: 20px; font-family: Arial, sans-serif; }
    h1 { font-size: 18px; color: #4F46E5; }
    button { 
      width: 100%; 
      padding: 10px; 
      background: #4F46E5; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #4338CA; }
    #status { margin-top: 10px; padding: 10px; background: #f3f4f6; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>JobApply Pro</h1>
  <button id="scanBtn">Scan for Jobs</button>
  <div id="status">Ready to scan</div>
  <script src="popup.js"></script>
</body>
</html>
